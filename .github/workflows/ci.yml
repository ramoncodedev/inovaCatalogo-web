name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teste_db_test
          POSTGRES_USER: catalogoweb
          POSTGRES_PASSWORD: catalogoweb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalogoweb -d teste_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/teste_db_test
          SPRING_DATASOURCE_USERNAME: catalogoweb
          SPRING_DATASOURCE_PASSWORD: catalogoweb
        run: ./mvnw -B verify